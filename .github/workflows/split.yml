name: Split Monorepo

on:
  push:
    branches:
      - main
    tags:
      - '*/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to split, e.g. guise/v3.1.0 (must already exist)'
        required: true
        type: string

jobs:
  split_branch:
    if: github.ref_type == 'branch' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: 'packages/trove'
            repo_name: 'trove'
          - local_path: 'packages/bloodhound'
            repo_name: 'bloodhound'
          - local_path: 'packages/cennad'
            repo_name: 'cennad'
          - local_path: 'packages/guise'
            repo_name: 'guise'
          - local_path: 'packages/threepio'
            repo_name: 'threepio'
          - local_path: 'packages/hound'
            repo_name: 'hound'
          - local_path: 'packages/deck'
            repo_name: 'deck'
          - local_path: 'packages/disguise'
            repo_name: 'disguise'
          - local_path: 'packages/usarrs'
            repo_name: 'usarrs'
          - local_path: 'packages/squidink'
            repo_name: 'squidink'
          - local_path: 'packages/parley'
            repo_name: 'parley'
          - local_path: 'packages/taxonomy'
            repo_name: 'taxonomy'
          - local_path: 'packages/skipper'
            repo_name: 'skipper'
          # Splits to letterofmarque/installer, not .../marque — that name is
          # the monorepo itself, and the split action would overwrite it with
          # package-only history. The Packagist name stays marque/marque.
          - local_path: 'packages/marque'
            repo_name: 'installer'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Split ${{ matrix.package.repo_name }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.package.local_path }}
          repository_organization: 'letterofmarque'
          repository_name: ${{ matrix.package.repo_name }}
          user_name: 'LOM Software'
          user_email: 'dan@lom.software'

  split_tag:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # On dispatch the default checkout is the branch head, not the tag.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Parse tag
        id: tag
        run: |
          # Tag format: <package>/v<version> e.g. cennad/v2.0.1
          # On dispatch the tag comes from the input; on push, from the ref.
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PACKAGE="${TAG%%/*}"
          VERSION="${TAG#*/}"

          # The split repo is normally named after the package directory, but
          # packages/marque cannot be: letterofmarque/marque IS this monorepo,
          # and splitting onto it would replace it with package-only history.
          # It publishes to Packagist as marque/marque regardless of the repo
          # name, so only the GitHub target is remapped.
          REPO="${PACKAGE}"
          if [ "${PACKAGE}" = "marque" ]; then
            REPO="installer"
          fi

          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "Splitting ${PACKAGE} at ${VERSION} -> letterofmarque/${REPO}"

      - name: Split ${{ steps.tag.outputs.package }} (${{ steps.tag.outputs.version }})
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: 'packages/${{ steps.tag.outputs.package }}'
          repository_organization: 'letterofmarque'
          repository_name: ${{ steps.tag.outputs.repo }}
          user_name: 'LOM Software'
          user_email: 'dan@lom.software'
          tag: ${{ steps.tag.outputs.version }}
