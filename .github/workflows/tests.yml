# Tiered so the cost lands where it buys something.
#
# A pull request runs SQLite only: fast feedback, and it catches the great
# majority of breakage. Pushes to main add MySQL, MariaDB and PostgreSQL,
# because "DB-agnostic" is a stated non-negotiable (docs/why.md) and the first
# real run of the suite on MySQL and Postgres — job #10548, 2026-09-03 — found
# eight test-only bugs that had been invisible for the life of the project.
# Nothing stops them coming back except a gate.
#
# MariaDB joined 2026-09-04 (job #10616): docs/product.md had claimed support
# for it since the beginning and it had never once been run. It is a separate
# Laravel driver with its own connection and grammar, not a MySQL alias.
#
# The real engines are deliberately not on the PR path: bloodhound takes 586s
# on MySQL against seconds on in-memory SQLite (real DDL per test), which is a
# fine price once per merge and a bad one per push.
#
# The full matrix, including --prefer-lowest, runs in nightly.yml.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Style and the generated changelog are repo-wide facts, not per-package
  # ones, so they run once rather than 11 times. bin/release gates on both
  # already; this is the same check moved earlier, where it is cheap to fix.
  lint:
    name: Lint and changelog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check code style
        run: composer lint:test

      - name: Check the root changelog is current
        run: bin/build-changelog --check

  # PHPStan cannot join the lint job: it needs each package's own vendor/ to
  # resolve models and facades, so it installs per package the way the test
  # matrix does. Level 1 across all eleven — see docs/how.md for why that
  # level and what it would take to raise it.
  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - threepio
          - trove
          - ise
          - squidink
          - bloodhound
          - hound
          - cennad
          - guise
          - disguise
          - usarrs
          - parley

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install root dependencies (phpstan + larastan)
        uses: ramsey/composer-install@v3

      - name: Install package dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: packages/${{ matrix.package }}
          composer-options: '--prefer-dist'

      - name: Analyse
        working-directory: packages/${{ matrix.package }}
        run: ../../vendor/bin/phpstan analyse --no-progress

  # Both ends of the declared `php: ^8.3` range, on SQLite. The PHP axis and
  # the database axis are independent — a syntax or stdlib difference does not
  # care which engine is behind it — so they are split across tiers rather than
  # multiplied together. Crossing them here would be 88 jobs a push to catch
  # what 22 already catches.
  pull-request:
    name: SQLite
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite"]'
      php-versions: '["8.3", "8.4"]'

  main:
    name: Cross-engine
    if: github.event_name == 'push'
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite", "mysql", "mariadb", "pgsql"]'
      php-versions: '["8.4"]'
