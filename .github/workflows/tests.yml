# Tiered so the cost lands where it buys something.
#
# A pull request runs SQLite only: fast feedback, and it catches the great
# majority of breakage. Pushes to main add MySQL and PostgreSQL, because
# "DB-agnostic" is a stated non-negotiable (docs/why.md) and the first real
# run of the suite on MySQL and Postgres — job #10548, 2026-09-03 — found
# eight test-only bugs that had been invisible for the life of the project.
# Nothing stops them coming back except a gate.
#
# MySQL is deliberately not on the PR path: bloodhound takes 586s there
# against seconds on in-memory SQLite (real DDL per test), which is a fine
# price once per merge and a bad one per push.
#
# The full matrix, including --prefer-lowest, runs in nightly.yml.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Style and the generated changelog are repo-wide facts, not per-package
  # ones, so they run once rather than 11 times. bin/release gates on both
  # already; this is the same check moved earlier, where it is cheap to fix.
  lint:
    name: Lint and changelog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check code style
        run: composer lint:test

      - name: Check the root changelog is current
        run: bin/build-changelog --check

  pull-request:
    name: SQLite
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite"]'

  main:
    name: Cross-engine
    if: github.event_name == 'push'
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite", "mysql", "pgsql"]'
