# Tiered so the cost lands where it buys something.
#
# A pull request runs SQLite only: fast feedback, and it catches the great
# majority of breakage. Pushes to main add MySQL, MariaDB and PostgreSQL,
# because "DB-agnostic" is a stated non-negotiable (docs/why.md) and the first
# real run of the suite on MySQL and Postgres — job #10548, 2026-09-03 — found
# eight test-only bugs that had been invisible for the life of the project.
# Nothing stops them coming back except a gate.
#
# MariaDB joined 2026-09-04 (job #10616): docs/product.md had claimed support
# for it since the beginning and it had never once been run. It is a separate
# Laravel driver with its own connection and grammar, not a MySQL alias.
#
# The real engines are deliberately not on the PR path: bloodhound takes 586s
# on MySQL against seconds on in-memory SQLite (real DDL per test), which is a
# fine price once per merge and a bad one per push.
#
# The full matrix, including --prefer-lowest, runs in nightly.yml.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Style and the generated changelog are repo-wide facts, not per-package
  # ones, so they run once rather than 11 times. the release tooling gates on both
  # already; this is the same check moved earlier, where it is cheap to fix.
  lint:
    name: Lint and changelog
    runs-on: ubuntu-24.04

    steps:
      # check-docs verifies the tags the docs name (`guise/v5.0.0`), and a
      # default checkout fetches none, so every tag would read as missing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: composer lint:test

      - name: Check the root changelog is current
        run: tools/build-changelog --check

      # Settings, defaults, package names, constraints and tags the public docs
      # mention, checked against the code. Known-unbuilt keys carry a
      # `check-docs: ignore — … #NNNN` marker and are listed, not failed.
      - name: Check the docs against the code
        run: tools/check-docs

  # PHPStan cannot join the lint job: it needs each package's own vendor/ to
  # resolve models and facades, so it installs per package the way the test
  # matrix does. Level 1 across every package — see docs/how.md for why that
  # level and what it would take to raise it.
  static-analysis:
    name: PHPStan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - threepio
          - trove
          - deck
          - squidink
          - bloodhound
          - hound
          - cennad
          - guise
          - disguise
          - usarrs
          - parley
          - taxonomy
          - skipper
          - bosun
          - marque

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install root dependencies (phpstan + larastan)
        uses: ramsey/composer-install@v4

      - name: Install package dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: packages/${{ matrix.package }}
          composer-options: '--prefer-dist'

      - name: Analyse
        working-directory: packages/${{ matrix.package }}
        run: ../../vendor/bin/phpstan analyse --no-progress

  # The PHP axis and the database axis are independent — a syntax or stdlib
  # difference does not care which engine is behind it — so they are split
  # rather than multiplied: the engines run on one PHP, and the rest of the
  # declared `php: ^8.3` range runs on SQLite.
  #
  # The engines run on 8.5: what the production consumer runs. The other
  # supported PHPs, 8.3 (the floor, Laravel 13's) and 8.4, run on SQLite on
  # every push, not only on pull requests: work here lands on main directly,
  # so a PR-only axis never ran (2026-11-23).
  #
  # Supported means 8.3 to 8.5 (VERSIONING.md). A newer PHP (8.6 since
  # 2026-11-19) should work and isn't blocked by composer.json, but isn't
  # supported until the yearly review adds it, so it isn't in this gate:
  # the nightly runs it as an early warning.
  pull-request:
    name: SQLite
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite"]'
      php-versions: '["8.3", "8.4", "8.5"]'

  main:
    name: Cross-engine
    if: github.event_name == 'push'
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite", "mysql", "mariadb", "pgsql"]'
      php-versions: '["8.5"]'

  main-php:
    name: PHP range
    if: github.event_name == 'push'
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite"]'
      php-versions: '["8.3", "8.4"]'
