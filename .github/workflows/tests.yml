name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        package:
          - threepio
          - trove
          - id
          - bloodhound
          - hound
          - cennad
          - guise
          - disguise
          - usarrs

    name: ${{ matrix.package }} (PHP ${{ matrix.php }})

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite, redis
          coverage: none

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: composer test
