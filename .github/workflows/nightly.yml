# The full matrix: every package, every engine, every supported PHP, both ends
# of every declared dependency range. Too many jobs for every push, so once a
# night.
#
# The axis that only exists here is --prefer-lowest, and for a *package* it is
# arguably the most valuable one in the whole file. Every package declares
# `illuminate/*: ^13.0`, which is a promise about the entire 13.x range — but
# `composer update` always resolves the newest, so only the top of that range
# is ever exercised. Nothing else catches "we used a method added in 13.10 and
# claimed 13.0"; a consumer pinned to 13.0 finds it instead, at which point it
# is their bug report and our broken constraint.
#
# Runs on schedule and on demand. Not a merge gate — a nightly failure means
# a constraint or an engine assumption is wrong, which wants a considered fix
# rather than a blocked merge.

name: Nightly

on:
  schedule:
    # 16:00 UTC — early morning in AEST, so a failure is waiting at the start
    # of the day rather than landing mid-session.
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  # Every engine on 8.5, what production runs, at both ends of the dependency
  # ranges.
  engines:
    name: Engines
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite", "mysql", "mariadb", "pgsql"]'
      dependency-versions: '["highest", "lowest"]'
      php-versions: '["8.5"]'

  # The other supported PHPs, on SQLite (a PHP difference doesn't care which
  # engine is behind it). 8.3 is the floor a consumer is entitled to run on,
  # and Laravel 13's own. Testing only one end of a declared range is the
  # same mistake --prefer-lowest exists to catch on the composer side.
  php-range:
    name: PHP range
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite"]'
      dependency-versions: '["highest", "lowest"]'
      php-versions: '["8.3", "8.4"]'

  # A PHP newer than the supported range: it "should work", and isn't
  # blocked by composer.json, but isn't supported until the yearly review
  # (Aug/Sep, with the Laravel bump) adds it. Run here as an early warning,
  # so that review starts from what's known rather than a surprise. The test
  # tooling doesn't allow 8.6 yet (Pest 4's paratest caps PHP at ~8.5), hence
  # dev-tools-ahead; see test-run.yml.
  php-ahead:
    name: PHP ahead (unsupported, early warning)
    uses: ./.github/workflows/test-run.yml
    with:
      databases: '["sqlite"]'
      dependency-versions: '["highest", "lowest"]'
      php-versions: '["8.6"]'
      dev-tools-ahead: '["8.6"]'
